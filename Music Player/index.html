<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="head">
            <img src="Image/back-button.png" alt="first">
            <img src="Image/menus.png" alt="menu">

        </div>
        <div class="music-img">
            <div class="back">
                <img src="Image/model.png" id="model">
            </div></div>
            <div class="name">
                <h3>Despacito</h3>
                <h5>Luis Fonsi ft Daddy Yankee</h5>
            
        </div>
        <audio controls id = "audio">
        <source src="introduction-199883.mp3" type="audio/mpeg"></audio>
        
        <div class="bottom-img">
            <div class="previous">
                <img src="Image/skip-previous.png" alt="previous">
            </div>
            <div class="play">
                <img src="Image/play (1).png" alt="play" id="ctrlIcon">
            </div>
            <div class="next">
                <img src="Image/next-track.png" alt="next">
            </div>
        </div>
    </div>
<script src="app.js"></script>    
</body>
</html>
